name: Duffel Sanitised Fixture Capture
on:
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Capture four cohort-shaped Duffel return searches
        env:
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import date, timedelta
          searches=[
            ("edi_vce_lh_candidate", [{"origin":"EDI","destination":"VCE","departure_date":"2026-10-20"},{"origin":"VCE","destination":"EDI","departure_date":"2026-10-27"}]),
            ("bhx_mad_lh_candidate", [{"origin":"BHX","destination":"MAD","departure_date":"2026-11-05"},{"origin":"MAD","destination":"BHX","departure_date":"2026-11-12"}]),
            ("man_vce_lx_candidate", [{"origin":"MAN","destination":"VCE","departure_date":"2026-11-20"},{"origin":"VCE","destination":"MAN","departure_date":"2026-11-27"}]),
            ("lhr_mad_codeshare_candidate", [{"origin":"LHR","destination":"MAD","departure_date":"2026-11-05"},{"origin":"MAD","destination":"LHR","departure_date":"2026-11-12"}]),
          ]
          output={"searches":[]}
          for label,slices in searches:
              payload={"data":{"slices":slices,"passengers":[{"type":"adult"}],"cabin_class":"economy"}}
              req=urllib.request.Request("https://api.duffel.com/air/offer_requests?return_offers=true",data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["DUFFEL_TOKEN"],"Duffel-Version":"v2","Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)["data"]
              cleaned=[]
              for offer in data.get("offers",[])[:100]:
                  safe_slices=[]
                  for sl in offer.get("slices") or []:
                      safe_segments=[]
                      for segment in sl.get("segments") or []:
                          safe_segments.append({
                              "marketing_carrier":{"iata_code":(segment.get("marketing_carrier") or {}).get("iata_code")},
                              "operating_carrier":{"iata_code":(segment.get("operating_carrier") or {}).get("iata_code")},
                          })
                      safe_slices.append({"segments":safe_segments})
                  cleaned.append({
                      "total_amount":offer.get("total_amount"),
                      "total_currency":offer.get("total_currency"),
                      "owner":{"iata_code":(offer.get("owner") or {}).get("iata_code")},
                      "slices":safe_slices,
                  })
              output["searches"].append({"label":label,"offers":cleaned})
          assert any(x["offers"] for x in output["searches"]), "No offers returned"
          for result in output["searches"]:
              offers=result["offers"]
              def first(o):
                  try: return o["slices"][0]["segments"][0]
                  except (KeyError,IndexError,TypeError): return {}
              differing_marketing_operating=sum(
                  (first(o).get("marketing_carrier") or {}).get("iata_code") !=
                  (first(o).get("operating_carrier") or {}).get("iata_code")
                  for o in offers if (first(o).get("marketing_carrier") or {}).get("iata_code")
                  and (first(o).get("operating_carrier") or {}).get("iata_code")
              )
              multi_segment=sum(len(o["slices"][0]["segments"])>1 for o in offers if o.get("slices"))
              owner_differs=sum(
                  (o.get("owner") or {}).get("iata_code") !=
                  (first(o).get("marketing_carrier") or {}).get("iata_code")
                  for o in offers if (o.get("owner") or {}).get("iata_code")
                  and (first(o).get("marketing_carrier") or {}).get("iata_code")
              )
              non_gbp=sum(o.get("total_currency")!="GBP" for o in offers)
              two_slices=sum(len(o.get("slices") or [])>=2 for o in offers)
              print("COVERAGE",json.dumps({"label":result["label"],"offers":len(offers),
                  "marketing_vs_operating":differing_marketing_operating,
                  "outbound_multisegment":multi_segment,"owner_vs_marketing":owner_differs,
                  "non_gbp":non_gbp,"two_slices":two_slices}))

          with open("duffel-sanitised-fixture.json","w") as f:
              json.dump(output,f,indent=2)
          print("BEGIN_SANITISED_DUFFEL_FIXTURE")
          print(json.dumps(output,indent=2))
          print("END_SANITISED_DUFFEL_FIXTURE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: duffel-sanitised-fixture
          path: duffel-sanitised-fixture.json
          retention-days: 1
