name: Check 3 Original Duffel Offers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare original offers (read-only)
        env:
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_API_KEY }}
        run: python scripts/check3_original_duffel_offers.py
