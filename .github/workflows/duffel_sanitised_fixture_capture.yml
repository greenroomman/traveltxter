name: Duffel Sanitised Fixture Capture
on:
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Capture one sanitised offer search
        env:
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import date, timedelta
          departure=(date.today()+timedelta(days=45)).isoformat()
          payload={"data":{"slices":[{"origin":"LHR","destination":"MAD","departure_date":departure}],"passengers":[{"type":"adult"}],"cabin_class":"economy"}}
          req=urllib.request.Request("https://api.duffel.com/air/offer_requests?return_offers=true",data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["DUFFEL_TOKEN"],"Duffel-Version":"v2","Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as response:
              data=json.load(response)["data"]
          sanitized=[]
          for offer in data.get("offers",[])[:20]:
              segments=(offer.get("slices") or [{}])[0].get("segments") or [{}]
              segment=segments[0]
              sanitized.append({"total_amount":offer.get("total_amount"),"total_currency":offer.get("total_currency"),"owner":{"iata_code":(offer.get("owner") or {}).get("iata_code")},"slices":[{"segments":[{"marketing_carrier":{"iata_code":(segment.get("marketing_carrier") or {}).get("iata_code")},"operating_carrier":{"iata_code":(segment.get("operating_carrier") or {}).get("iata_code")}}]}]})
          assert sanitized, "No offers returned"
          with open("duffel-sanitised-fixture.json","w") as f: json.dump({"offers":sanitized},f,indent=2)
          print("Sanitised offers:",len(sanitized),"— no IDs or credentials emitted")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: duffel-sanitised-fixture
          path: duffel-sanitised-fixture.json
          retention-days: 1
